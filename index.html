<title>The Trestle Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Cormorant+Garamond:wght@600;700&family=Literata:wght@400;500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app bar with "view as" switcher, tabs, then two-pane views (list | detail) that stack on phones; calendar is a month grid over an agenda */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef3; --fg:#18202e; --muted:#5b6475; --line:#d8dce5;
  --accent:#1f3b73; --accent-fg:#ffffff; --accent-soft:#e2e9f7; --gold:#8a6612; --gold-soft:#f4ead2;
  --ok:#1d6b45; --ok-soft:#dff1e7; --danger:#a12a2a;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#181e29; --sunk:#202837; --fg:#e7eaf0; --muted:#9aa3b5; --line:#2c3546;
  --accent:#8fb0f0; --accent-fg:#0e1420; --accent-soft:#1e2a44; --gold:#d9b25a; --gold-soft:#2e2717;
  --ok:#7fd1a4; --ok-soft:#183126; --danger:#f08a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#181e29; --sunk:#202837; --fg:#e7eaf0; --muted:#9aa3b5; --line:#2c3546;
  --accent:#8fb0f0; --accent-fg:#0e1420; --accent-soft:#1e2a44; --gold:#d9b25a; --gold-soft:#2e2717;
  --ok:#7fd1a4; --ok-soft:#183126; --danger:#f08a8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hdr-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.acct{position:relative}
.acct-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer}
.acct-btn:hover{border-color:var(--accent)}
.acct-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px;z-index:30;display:grid;gap:10px}
.acct-pop .row{display:flex;gap:12px;align-items:center}
.acct-pop .mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;cursor:pointer}
.acct-pop .mi:hover{background:var(--sunk)}
.acct-pop hr{border:0;border-top:1px solid var(--line);margin:0}
.pics{display:grid;gap:4px;border-radius:10px;overflow:hidden}.pics.n1{grid-template-columns:1fr}.pics.n2,.pics.n4{grid-template-columns:1fr 1fr}.pics.n3{grid-template-columns:1fr 1fr}.pics.n3 button:first-child{grid-column:1/3}
.pics button{padding:0;border:0;background:var(--line);cursor:zoom-in;display:block;min-height:0}.pics img{display:block;width:100%;height:100%;max-height:420px;object-fit:cover}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumb{position:relative}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}.thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#333;color:#fff;font-size:13px;line-height:1;cursor:pointer}
.fchip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-decoration:none;color:inherit}
.pollbar{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:transparent;color:inherit;cursor:pointer;overflow:hidden;margin:0 0 6px}.pollbar i{position:absolute;inset:0 auto 0 0;background:rgba(120,140,200,.25)}.pollbar span{position:relative;display:flex;justify-content:space-between;gap:10px}.pollbar.me{border-width:2px}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}.lbx img{max-width:96vw;max-height:92vh}
.avatar.photo{background-size:cover;background-position:center;color:transparent}
.avatar.big{width:64px;height:64px;font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg label{cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 12px;font-size:13px;color:var(--muted);white-space:nowrap;border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-fg)}
.seg label:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:600px){.seg span{padding:5px 8px;font-size:12px}}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:0;padding:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(16px)}
.sw input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acct-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:end;margin-bottom:12px}
.acct-row label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
@media (max-width:600px){.acct-name{display:none}.acct-btn{padding-right:3px}}
.viewas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.viewas label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=time],input[type=email],input[type=tel],textarea{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.out .viewas,body.out nav.tabs,body.out .demo-note{display:none}
.login{max-width:380px;margin:8vh auto 0;padding:28px 26px;text-align:center}
.login h2{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 4px}
.login .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.login .fake{display:block;text-align:left;margin:0 0 12px}
.login .fake span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.login .fake div{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:9px 10px;color:var(--muted);font-size:14px;user-select:none;cursor:default}
.login .btn{width:100%;padding:10px 14px;margin-top:6px}
.login .hint{margin-top:14px}
.demo-note{background:var(--gold-soft);font-size:13px}
.demo-note .wrap{padding-block:8px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.demo-note b{color:var(--gold)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-block:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabgrp{position:relative;display:flex}
nav.tabs .caret{padding-left:2px;padding-right:8px}
nav.tabs .tabgrp>button[data-go]{padding-right:4px}
.subnav{position:absolute;left:0;top:100%;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:25;display:grid;gap:2px}
nav.tabs .subnav button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;color:var(--fg);white-space:normal}
nav.tabs .subnav button:hover{background:var(--sunk)}
nav.tabs .subnav .badge{position:static}
@media (max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-bottom:0;flex-wrap:nowrap;justify-content:space-around;gap:0}
  .tabgrp{flex:1;min-width:0;position:static}
  nav.tabs>.tabgrp>button[data-tab],nav.tabs>.tabgrp>button[data-go]{flex:1;min-width:0}
  nav.tabs>.tabgrp>button:not(.caret){width:100%}
  nav.tabs>.tabgrp>.caret{flex:none;width:30px;padding:10px 0}
  nav.tabs>.tabgrp>button{padding:10px 2px;font-size:12px;text-align:center;border-bottom:0;border-top:3px solid transparent;white-space:normal;line-height:1.2}
  nav.tabs>.tabgrp>button[aria-selected=true]{border-top-color:var(--accent)}
  .subnav{position:fixed;left:12px;right:12px;top:auto;bottom:calc(68px + env(safe-area-inset-bottom,0px));min-width:0}
  nav.tabs .subnav button{padding:14px 12px;font-size:16px}
  main.wrap{padding-bottom:84px}
}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:inherit}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start;padding-bottom:40px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:18px}
.filters{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.count{font-size:12px;color:var(--muted)}
.list{max-height:68vh;overflow-y:auto}
@media (max-width:820px){.list{max-height:360px}}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.tk{margin-left:16px;border-left:2px solid var(--line)}
.tnode{background:var(--sunk)}
.tnode .num{color:var(--accent)}
.dnode .num{font-size:24px;line-height:1;font-weight:700}
.item.person{grid-template-columns:36px minmax(0,1fr) auto}
.item:hover{background:var(--sunk)}
.item[aria-current=true]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
.iname{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isub{font-size:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
.avatar.big{width:64px;height:64px;font-size:22px;font-family:var(--f-display)}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.pilot{background:var(--gold-soft);color:var(--gold);font-weight:600}
.chip.mem{background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.acc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.detail{padding:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h2.title{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;margin:4px 0 10px;text-wrap:balance}
h3.sub{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;align-items:center}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.unset{color:var(--muted);font-style:italic}
.section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.private{background:var(--sunk);border-radius:8px;padding:14px}
.locked{color:var(--muted);font-size:14px}
form.edit{display:grid;gap:12px;max-width:560px}
form.edit label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:28px;color:var(--muted);text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
a.card{text-decoration:none;color:inherit}
.card .t{font-weight:600}
.matrix-wrap{overflow-x:auto}
table.matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.matrix th,table.matrix td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center}
table.matrix th:first-child,table.matrix td:first-child{text-align:left}
table.matrix thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;vertical-align:bottom}
.lvl{display:block;font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{padding:8px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:max-content minmax(0,1fr);gap:12px}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
.stack{display:grid;gap:20px;padding-bottom:40px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.inline-form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
/* resume */
.resume{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.resume li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.resume .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.resume .what{font-weight:500}
.resume .where{font-size:13px;color:var(--muted)}
.badge{background:#c0392b;color:#fff;border-radius:999px;font-size:11px;font-weight:600;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;line-height:1}
.acct-btn .badge{position:absolute;top:-4px;right:-4px}
.item.msg{grid-template-columns:36px minmax(0,1fr) auto}
.thread{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px 10px}
.bub{max-width:80%;background:var(--sunk);border-radius:14px;padding:8px 12px;justify-self:start;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{justify-self:end;background:var(--accent);color:var(--accent-fg)}
.bub .who{font-size:12px;opacity:.75;display:block;margin-bottom:2px}.bub .when{font-size:11px;opacity:.7;display:block;margin-top:2px}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 6px;cursor:pointer}
.pick[aria-pressed=true]{background:var(--accent-soft)}
.avatar.sm{width:30px;height:30px;font-size:11px;flex:none}
.rxrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.rxbar{display:inline-flex;gap:6px}
.rx{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.rx:hover{border-color:var(--accent)}
.rx.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.cmlist{display:grid;gap:10px;padding-left:6px;border-left:2px solid var(--line)}
.cm{display:flex;gap:8px;align-items:flex-start}.cmb{min-width:0;flex:1;display:grid;gap:3px}
.cmform{display:flex;gap:8px}.cmform input{flex:1}
.evcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;background:var(--sunk);border-radius:8px;padding:12px}
.evcard .date{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}.evcard .date b{display:block;font-size:22px;color:var(--fg)}
.linklike{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;text-align:left}
.xbtn{background:none;border:0;color:var(--danger);cursor:pointer;font-size:13px;padding:0 4px}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* calendar */
.calbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;min-width:190px;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.month .dow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.day{min-height:92px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{background:var(--sunk);color:var(--muted)}
.day:hover{background:var(--accent-soft)}
.day[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.day.today .dnum{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px;align-self:flex-start}
.pill{font-size:11px;line-height:1.3;padding:2px 5px;border-radius:4px;background:var(--sunk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--muted)}
.pill.t-stated{border-left-color:var(--accent);background:var(--accent-soft)}
.pill.t-degree{border-left-color:var(--gold);background:var(--gold-soft)}
.pill.t-social{border-left-color:var(--ok);background:var(--ok-soft)}
.more{font-size:11px;color:var(--muted)}
.detail .day{min-height:64px;padding:4px}.detail .pill{font-size:10px;padding:1px 4px}
@media (max-width:600px){.pill.multi{background:var(--bc)}.day{min-height:54px;padding:4px}.pill{font-size:0;padding:0;height:6px;border-left-width:0;border-radius:3px}.pill.t-stated{background:var(--accent)}.pill.t-degree{background:var(--gold)}.pill.t-social{background:var(--ok)}.pill.t-other{background:var(--muted)}.more{display:none}.calnav h2{min-width:0;font-size:20px}}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}

/* Memory Drill Engine styles. Everything is scoped under .md-drill.
   Re-theme by overriding these variables on .md-drill (or a parent). Default is the dark look. */
.md-drill {
  --md-bg: #121722; --md-card: #1a2130; --md-ink: #e7eaf1; --md-muted: #9aa3b5; --md-line: #2d3649;
  --md-accent: #9db4ec; --md-gold: #d6b066; --md-reveal: #26324c;
  --md-head-font: "Cormorant Garamond", Georgia, serif; --md-body-font: "Literata", Georgia, serif;
  display: block; max-width: 760px; margin: 0 auto; padding: 28px 16px 60px;
  background: var(--md-bg); color: var(--md-ink); font-family: var(--md-body-font); color-scheme: dark;
}
.md-drill [hidden] { display: none !important; }
.md-drill header h1 { font-family: var(--md-head-font); font-size: 2.3rem; line-height: 1.05; margin: 0; color: var(--md-accent); text-wrap: balance; }
.md-drill header p { margin: .4rem 0 0; color: var(--md-muted); font-size: .95rem; }
.md-levels { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 10px; }
.md-levels button { font: inherit; font-size: .9rem; border: 1px solid var(--md-line); background: var(--md-card); color: var(--md-ink); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.md-levels button b { color: var(--md-gold); }
.md-levels button[aria-pressed="true"] { background: var(--md-accent); border-color: var(--md-accent); color: var(--md-bg); }
.md-levels button[aria-pressed="true"] b { color: var(--md-bg); }
.md-drill button:focus-visible { outline: 2px solid var(--md-gold); outline-offset: 2px; }
.md-hint { color: var(--md-muted); font-size: .88rem; min-height: 1.3em; margin: 0 0 14px; }
.md-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.md-tools button { font: inherit; font-size: .85rem; background: none; border: 1px solid var(--md-line); color: var(--md-accent); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.md-tools select { font: inherit; font-size: .85rem; background: var(--md-card); color: var(--md-ink); border: 1px solid var(--md-line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.md-sheet { background: var(--md-card); border: 1px solid var(--md-line); border-radius: 10px; padding: 26px 24px; }
.md-sheet h2 { font-family: var(--md-head-font); letter-spacing: .14em; text-transform: uppercase; font-size: 1.05rem; color: var(--md-gold); margin: 0 0 14px; text-align: center; }
.md-sheet p { font-size: 1.12rem; line-height: 1.95; margin: 0 0 1.1em; max-width: 65ch; white-space: pre-line; }
.md-sheet p:last-child { margin-bottom: 0; }
.md-w { cursor: pointer; border-radius: 3px; padding: 0 1px; }
.md-w:hover, .md-w.open { background: var(--md-reveal); }
.md-x { color: var(--md-gold); letter-spacing: .06em; }
.md-lbl { display: block; font-family: var(--md-head-font); font-size: .95rem; letter-spacing: .1em; text-transform: uppercase; color: var(--md-gold); margin-bottom: 2px; }
.md-num { font-size: .7rem; color: var(--md-muted); margin-right: 6px; vertical-align: .25em; }
.md-foot { margin-top: 18px; color: var(--md-muted); font-size: .8rem; }
@media (max-width: 600px) {
  .md-drill { padding: 14px 12px 40px; }
  .md-drill header h1 { font-size: 1.6rem; }
  .md-drill header p { font-size: .85rem; }
  .md-levels { margin: 14px 0 8px; gap: 6px; }
  .md-levels button { padding: 6px 10px; font-size: .82rem; }
  .md-sheet { padding: 16px 14px; }
  .md-sheet p { font-size: 1rem; line-height: 1.85; }
}

/* ---- Welcome intro ("Masonic Learning, Made Fun") ---- */
#drillintro{--gold:#d6b066;--ink:#e7eaf1;--muted:#9aa3b5;--accent:#9db4ec;position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,#1d2740 0%,#0d111a 75%);cursor:pointer;transition:transform .9s cubic-bezier(.7,0,.3,1),opacity .9s}
#drillintro.up{transform:translateY(-100%);opacity:.6}
#drillintro svg{width:120px;height:120px;margin-bottom:18px}
#drillintro .ln{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:ddraw 1.1s ease-out forwards}
#drillintro .ln2{animation-delay:.35s}
#drillintro .gl{fill:var(--gold);opacity:0;animation:ddfade .5s ease-out 1.2s forwards}
#drillintro .wl{font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:1rem;opacity:0;animation:drise .7s ease-out .9s forwards}
#drillintro .hd{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:var(--ink);font-size:clamp(2rem,7vw,3.6rem);line-height:1.05;margin:.3em 0;opacity:0;animation:drise .8s ease-out 1.3s forwards}
#drillintro .hd em{font-style:normal;color:var(--accent)}
#drillintro .sb{color:var(--muted);font-size:.95rem;opacity:0;animation:drise .7s ease-out 1.8s forwards}
#drillintro .tap{position:absolute;bottom:22px;color:var(--muted);font-size:.75rem;letter-spacing:.1em;opacity:0;animation:ddfade .6s ease-out 2.4s forwards}
@keyframes ddraw{to{stroke-dashoffset:0}}
@keyframes dfade{to{opacity:1}}
@keyframes drise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#drillintro *{animation-duration:.01s!important;animation-delay:0s!important}#drillintro{transition:opacity .4s}#drillintro.up{transform:none;opacity:0}}

// Renders one memorization drill (from a drill JSON spec) into any container element.
// No dependencies, no build step. Works as an ES module in any framework (React, Vue,
// Svelte, plain HTML). Styles live in drill-engine.css, scoped under .md-drill.

//   import { renderDrill } from './drill-engine.js';

//     disclaimer?: string, hidden?: boolean }

const LEVELS = [
  { name: 'Full text', hint: 'Read it through a few times. Say it out loud.' },
  { name: 'Level 1', hint: '3rd and 4th letters hidden. Say each word, then tap to check if unsure.' },
  { name: 'Level 2', hint: 'About half the letters hidden at random. Hit New shuffle for a fresh set.' },
  { name: 'Level 3', hint: 'First and last letter only.' },
  { name: 'Level 4', hint: 'First letter plus a blank for each missing letter, so you can see word length.' },
  { name: 'Level 5', hint: 'First letters only. This is the one to carry into lodge.' },
  { name: 'Level 6', hint: 'Paragraph openers only. Recite the rest from memory, then check with Full.' }

const BLANK = '<span class="md-x">_</span>';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Small seeded random generator so Level 2 is stable until "New shuffle" is pressed.
function rng(seed) {
  let s = seed >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// Masks one word for a level. Exported so a host app can reuse it (e.g. flash cards).
function maskWord(w, level, r) {
  if (level === 0) return esc(w);
  const first = w[0], rest = w.slice(1);
  if (level === 1) return [...w].map((c, i) => (i === 2 || i === 3) ? BLANK : esc(c)).join('');
  if (level === 2) return esc(first) + [...rest].map(c => (r() < 0.5 ? BLANK : esc(c))).join('');
  if (level === 3) return w.length <= 2 ? esc(w) : esc(first) + BLANK.repeat(w.length - 2) + esc(w[w.length - 1]);

  if (level === 5) return esc(first);
  return '';
}

    '<div class="md-levels" role="group" aria-label="Difficulty level"></div>' +
    '<p class="md-hint"></p>' +
    '<div class="md-tools"><select class="md-para" aria-label="Which paragraph"><option value="all">All of it</option></select>' +
    '<button type="button" class="md-shuffle">New shuffle</button>' +
    '<button type="button" class="md-close">Hide peeked words</button></div>' +
    '<article class="md-sheet"></article>' +
    '<footer class="md-foot">' + esc(spec.disclaimer || opts.disclaimer || '') + '</footer>';

  LEVELS.forEach((L, i) => {

    destroy() { el.innerHTML = ''; el.classList.remove('md-drill'); },

// manifest.json lists every drill with its group. Degree access rules:
//   EA sees EA only. FC sees EA + FC. MM sees everything.
// Hidden drills never appear in a list; they open only by direct slug.

function drillsForDegree(manifest, degree) {
  const allowed = manifest.access[String(degree).toUpperCase()] || [];
  return manifest.drills.filter(d => !d.hidden && allowed.includes(d.group));
}

function canOpen(manifest, degree, slug) {
  const d = manifest.drills.find(x => x.slug === slug);
  if (!d) return false;
  if (d.hidden) return true; // hidden = link-only, shared on purpose
  return (manifest.access[String(degree).toUpperCase()] || []).includes(d.group);
}

const EDIT_OFFICES=["Worshipful Master","Senior Warden","Junior Warden","Treasurer","Secretary"];
function officeEdit(l){
  const p=myProfile(); if(!p||!l||l.gl) return false;
  return (p.current||[]).some(c=>{
    const t=String(c.title||"").trim(), b=String(c.body||"");
    if(EDIT_OFFICES.includes(t)) return new RegExp("No\\.\\s*"+l.n+"\\b").test(b);
    if(/^(District|DDGM)\b/i.test(t)){const m=b.match(/District\s+(\S+)/i); return !!m&&m[1]===String(l.d);}
    if(/^Grand\b/i.test(t)) return true;
    return false;
  });
}
function canEdit(l){
  const u=me(); if(!role()||!l) return false;
  if(can("editAnyLodge")) return true;
  if(l.gl) return false;
  if(officeEdit(l)) return true;
  if(can("editDistrictLodges")&&u.district===l.d) return true;
  if(can("editOwnLodge")&&myLodges().includes(l.n)) return true;
  return false;
}

function parseMeet(s){
  const m=/(1st|2nd|3rd|4th|5th)\s+(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\w*\s*@\s*(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(s||"");
  if(!m) return null;
  let h=(+m[3])%12; if(/pm/i.test(m[5])) h+=12;
  const d=m[2][0].toUpperCase()+m[2].slice(1,3).toLowerCase();
  return{nth:parseInt(m[1]),dow:DOWS.indexOf(d),time:`${pad(h)}:${m[4]}`};
}
function nthDow(y,mo,nth,dow){const f=new Date(y,mo,1).getDay();const d=1+((dow-f+7)%7)+(nth-1)*7;return new Date(y,mo,d).getMonth()===mo?d:null}
function monthEvents(y,mo){
  const out=[];
  for(const l of L){ if(!l.meet) continue; const p=parseMeet(l.meet); if(!p) continue;
    const d=nthDow(y,mo,p.nth,p.dow); if(!d) continue;
    out.push({id:`st-${l.n}-${y}-${mo}`,n:l.n,title:"Stated meeting",type:"Stated meeting",date:ymd(y,mo,d),time:p.time,vis:"public",auto:true});}
  const pre=`${y}-${pad(mo+1)}-`;
  for(const e of S.events) if(e.date.startsWith(pre)) out.push(e);
  return out.filter(visibleEv).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function visibleEv(e){const l=byNum(e.n);return !!l&&(e.vis==="public"||canSeePrivate(l))}
function inScope(e){if(S.calScope==="all"||!signedIn())return true;return following(byNum(e.n))}
function upcomingFor(n,count){
  const res=[];let y=today.getFullYear(),m=today.getMonth();
  for(let i=0;i<4&&res.length<count;i++){
    for(const e of monthEvents(y,m)) if(e.n===n&&e.date>=TODAY) res.push(e);
    m++; if(m>11){m=0;y++}
  }
  return res.slice(0,count);
}
function gcal(e){
  const l=byNum(e.n);const[y,mo,d]=e.date.split("-");const[h,mi]=(e.time||"19:00").split(":");
  const eh=pad(Math.min(23,+h+2));
  const loc=[l.addr,l.city,"TX"].filter(Boolean).join(", ");
  const q=new URLSearchParams({action:"TEMPLATE",text:`${e.title} · ${lname(l)}`,dates:`${y}${mo}${d}T${h}${mi}00/${y}${mo}${d}T${eh}${mi}00`,ctz:"America/Chicago",details:e.notes||"",location:loc});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function prettyDate(s){const[y,m,d]=s.split("-").map(Number);const dt=new Date(y,m-1,d);return`${DOWS[dt.getDay()]}, ${MONTHS[m-1].slice(0,3)} ${d}`}

const monOk=sec=>{const d=degreeOf();return !!d&&(MON.access[d]||[]).includes(sec.group)};
const monFmt=t=>esc(t).replace(/\{p(\d+)\}/g,'<span class="mpi">[p. $1]</span>').replace(/\{i\}/g,"<em>").replace(/\{\/i\}/g,"</em>").replace(/\{b\}/g,"<strong>").replace(/\{\/b\}/g,"</strong>");
function monEdition(){const e=MON.edition;return `<div class="mon-ed"><b>Edition on file: ${esc(e.label)}</b><div>${esc(e.copyright)}. ${esc(e.transcribed)}.</div><div class="hint" style="margin:4px 0 0">This is the edition the text below was copied from. If the Grand Lodge issues a newer Monitor, this copy is out of date and must be updated. Always check your printed Monitor.</div></div>`}
function monBlock(b){const [k,t]=b;
  if(k==="h")return `<h3 class="mh">${monFmt(t)}</h3>`;
  if(k==="r")return `<p class="mr">${monFmt(t)}</p>`;
  if(k==="n")return `<p class="mn">${monFmt(t)}</p>`;
  if(k==="x")return `<p class="mx">${monFmt(t)}</p>`;
  if(k==="h2")return `<h4 class="mh2">${monFmt(t)}</h4>`;
  if(k==="v")return `<p class="mv">${monFmt(t).replace(/\n/g,"<br>")}</p>`;
  if(k==="l")return `<p class="ml">${monFmt(t)}</p>`;
  if(k==="tbl")return `<div class="mtw"><table class="mt">${t.map(r=>`<tr>${r.map(c=>`<td>${monFmt(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  if(k==="fig")return `<figure class="mfig"><img src="${esc(t)}" alt="${esc(b[2]||"Figure from the Monitor")}" loading="lazy">${b[2]?`<figcaption>${monFmt(b[2])}</figcaption>`:""}</figure>`;
  if(k==="st")return `<div class="mst">* * * * * *</div>`;
  if(k==="pb")return `<div class="mpb"><span>Page ${esc(t)}</span></div>`;
  return `<p>${monFmt(t)}</p>`}
function monResults(){

    txt=txt.replace(/\{p\d+\}|\{\/?i\}/g,"");const i=txt.toLowerCase().indexOf(q);if(i<0)return null;
    const a=Math.max(0,i-50),sn=(a?"…":"")+txt.slice(a,i+q.length+80)+"…";return {sec,sn}}).filter(Boolean);
  if(!hits.length)return `<p class="hint">Nothing found for “${esc(S.monQ)}” in the sections open to you.</p>`;
  return `<div class="dgrp">${hits.map(h=>`<button type="button" class="dbtn mres" data-act="mon-open" data-id="${h.sec.id}"><span>${esc(h.sec.title)}<small>${esc(h.sn)}</small></span><span class="pg">p. ${esc(h.sec.pages)}</span></button>`).join("")}</div>`}

  if(t.id==="post-files"){const f=t.files[0];t.value="";if(!f)return;if(f.size>400*1024){toast("Files in the demo are limited to 400 KB");return}if(DRAFT.files.length>=3){toast("Up to 3 files per post");return}const r=new FileReader();r.onload=()=>{DRAFT.files.push({name:f.name,size:f.size,url:r.result});refreshAttach()};r.readAsDataURL(f);return}
  if(t.id==="post-to"){S.postTo=t.value;const r=document.getElementById("post-reach");if(r)r.textContent="Reaches: "+bReach(bFromKey(t.value))+".";save();return}
  if(t.id==="feed-filter"){S.feedFilter=t.value;const fv=t.value;let k="";
    if(fv.startsWith("at:")){const n=+fv.slice(3);k=n===0?"gl":"l:"+n}
    else if(fv.startsWith("ad:"))k="d:"+fv.slice(3);
    else if(fv.startsWith("ab:")){const b=entById(fv.slice(3));if(b)k=b.lvl==="orient"?"or":(b.lvl==="valley"?"v:":"a:")+b.id}
    if(k&&boardsICanPost().some(b=>bKey(b)===k))S.postTo=k;
    render();return}
  if(t.id==="scope"){S.calScope=t.value;render();return}
  if(t.dataset.sw===undefined&&t.id&&t.id.startsWith("pv-")){const s=document.querySelector(`[data-sw="${t.id}"]`);if(s)s.textContent=t.checked?"Public":"Private";return}
  if(t.id==="photo-file"){const f=t.files&&t.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);
    img.onload=()=>{const c=document.createElement("canvas"),s=Math.min(img.width,img.height),N=160;c.width=c.height=N;c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N);URL.revokeObjectURL(url);saveAcct();ct(myProfile(),"photo").v=c.toDataURL("image/jpeg",.82);logIt("updated their profile picture");render();toast("Photo updated. Save to keep your other changes.")};
    img.onerror=()=>{URL.revokeObjectURL(url);toast("That file isn't an image I can read")};img.src=url;return}
  if(t.id==="cal-add"){if(t.value){const cur=[...calKeys()];if(!cur.includes(t.value))cur.push(t.value);S.calBodies=cur;S.calDay=null}render();return}
  if(t.id==="lodge-cal-gl"){S.lodgeCalGL=t.checked;render();return}
  if(t.dataset.perm){const r=S.roles[t.dataset.role];r.perms[t.dataset.perm]=t.checked?1:0;
    logIt(`${t.checked?"gave":"removed"} "${PERMS.find(p=>p[0]===t.dataset.perm)[1]}" ${t.checked?"to":"from"} ${r.label}`);render();}
});
